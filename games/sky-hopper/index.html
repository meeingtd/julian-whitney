<title>Sky Hopper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: a portrait handheld screen centered on a late-afternoon sky, title above, one-line controls below. Single look by choice. */
  :root {
    --page: #1f2d4d;       /* page behind the screen */
    --sky-top: #6fb8e8;
    --sky-low: #ffd9a8;
    --hill-far: #a7cfa0;
    --hill-near: #6fae6a;
    --ground: #e3c27f;
    --ground-dark: #c49a52;
    --pillar: #4f9d5a;
    --pillar-dark: #34763f;
    --pillar-lip: #63b86d;
    --bird: #f2603b;
    --belly: #ffd3a0;
    --ink: #fff8ec;
    --outline: #22263a;
    --muted: #b7c0d8;
    --bronze: #c98a4b;
    --silver: #cfd6e2;
    --gold: #f4c542;
    --font-display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: var(--font-body); }
  main {
    min-height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .screen {
    width: min(100%, 520px, calc((100vh - 120px) * 2 / 3));
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .best { color: var(--muted); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .best strong { color: var(--gold); }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 2 / 3;
    max-width: 100%;
    border-radius: 14px;
    background: var(--sky-top);
    touch-action: manipulation;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas:focus { outline: none; }
  canvas:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .hint { margin: 0; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
  kbd {
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 12px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-bottom-width: 3px;
    border-radius: 5px;
    padding: 1px 6px;
  }
</style>

<main>
  <div class="screen">
    <header>
      <h1>Sky Hopper</h1>
      <span class="best">Best <strong id="bestLabel">0</strong></span>
    </header>
    <canvas id="game" tabindex="0" aria-label="Sky Hopper game. Press Space or tap to flap."></canvas>
    <p class="hint">Flap with <kbd>Space</kbd>, <kbd>↑</kbd>, a click or a tap. <kbd>P</kbd> pauses.</p>
  </div>
</main>

<script>
(() => {
  const W = 480, H = 720, STEP = 1 / 60;
  const GROUND_H = 96, GROUND_Y = H - GROUND_H;
  const BIRD_X = 140, BIRD_R = 15;
  const GRAVITY = 1550, FLAP_V = -470, MAX_FALL = 720;
  const PILLAR_W = 76, LIP_H = 26, LIP_OVER = 6, SPACING = 250;
  const MEDALS = [
    { at: 40, name: "Gold", key: "gold" },
    { at: 20, name: "Silver", key: "silver" },
    { at: 10, name: "Bronze", key: "bronze" },
  ];
  const BEST_KEY = "sky-hopper-best";

  const css = getComputedStyle(document.documentElement);
  const C = {};
  for (const k of ["sky-top", "sky-low", "hill-far", "hill-near", "ground", "ground-dark", "pillar",
    "pillar-dark", "pillar-lip", "bird", "belly", "ink", "outline", "bronze", "silver", "gold"]) {
    C[k] = css.getPropertyValue("--" + k).trim();
  }

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const bestLabel = document.getElementById("bestLabel");

  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}
  bestLabel.textContent = best;

  let state = "ready";   // ready | playing | paused | dead
  let bird, pillars, score, newBest, deadTimer, flash, time, groundX, hillX, cloudX;

  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: i * 130 + Math.random() * 60, y: 60 + Math.random() * 220, s: 0.7 + Math.random() * 0.6,
  }));

  function reset() {
    bird = { y: H * 0.42, vy: 0, angle: 0, wing: 0 };
    pillars = [];
    score = 0;
    newBest = false;
    deadTimer = 0;
    flash = 0;
    state = "ready";
  }

  const speed = () => 170 + Math.min(score, 30) * 2.5;
  const gap = () => Math.max(140, 190 - score * 1.5);

  function addPillar() {
    const g = gap();
    const minY = 90 + g / 2, maxY = GROUND_Y - 90 - g / 2;
    pillars.push({ x: W + 20, gapY: minY + Math.random() * (maxY - minY), gap: g, scored: false });
  }

  function flap() {
    if (state === "paused") { state = "playing"; return; }
    if (state === "dead") {
      if (deadTimer > 0.7 && bird.y + BIRD_R >= GROUND_Y - 1) reset();
      return;
    }
    if (state === "ready") state = "playing";
    bird.vy = FLAP_V;
    bird.wing = 1;
  }

  function die() {
    if (state === "dead") return;
    state = "dead";
    flash = 1;
    deadTimer = 0;
    if (score > best) {
      best = score;
      newBest = true;
      bestLabel.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
  }

  const circleHitsRect = (cx, cy, r, x, y, w, h) => {
    const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  };

  // ---------- update ----------
  function update(dt) {
    if (state === "paused") return;
    time += dt;
    flash = Math.max(0, flash - dt * 3);
    bird.wing = Math.max(0, bird.wing - dt * 5);

    const scrolling = state === "ready" || state === "playing";
    if (scrolling) {
      const v = speed();
      groundX = (groundX - v * dt) % 48;
      hillX -= v * 0.3 * dt;
      cloudX -= v * 0.1 * dt;
    }

    if (state === "ready") {
      bird.y = H * 0.42 + Math.sin(time * 5) * 8;
      bird.angle = 0;
      if (Math.floor(time * 4) % 2 === 0) bird.wing = 0.6;
      return;
    }

    bird.vy = Math.min(MAX_FALL, bird.vy + GRAVITY * dt);
    bird.y += bird.vy * dt;
    if (bird.y < BIRD_R) { bird.y = BIRD_R; bird.vy = 0; }
    const target = bird.vy < 0 ? -0.45 : Math.min(1.4, bird.vy / 500);
    bird.angle += (target - bird.angle) * Math.min(1, dt * 10);

    if (bird.y + BIRD_R >= GROUND_Y) {
      bird.y = GROUND_Y - BIRD_R;
      bird.vy = 0;
      die();
    }

    if (state === "dead") { deadTimer += dt; return; }

    const v = speed();
    for (const p of pillars) p.x -= v * dt;
    pillars = pillars.filter(p => p.x + PILLAR_W + LIP_OVER > 0);
    if (!pillars.length || pillars[pillars.length - 1].x < W + 20 - SPACING) addPillar();

    for (const p of pillars) {
      const top = p.gapY - p.gap / 2, bottom = p.gapY + p.gap / 2;
      const lx = p.x - LIP_OVER, lw = PILLAR_W + LIP_OVER * 2;
      if (circleHitsRect(BIRD_X, bird.y, BIRD_R - 2, lx, -100, lw, top + 100) ||
          circleHitsRect(BIRD_X, bird.y, BIRD_R - 2, lx, bottom, lw, GROUND_Y - bottom)) {
        die();
        return;
      }
      if (!p.scored && p.x + PILLAR_W < BIRD_X) { p.scored = true; score++; }
    }
  }

  // ---------- render ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, C["sky-top"]);
    g.addColorStop(1, C["sky-low"]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND_Y);

    ctx.fillStyle = "rgba(255, 245, 220, 0.85)";      // low sun
    ctx.beginPath(); ctx.arc(360, GROUND_Y - 190, 46, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    for (const c of clouds) {
      const x = ((c.x + cloudX * c.s) % (W + 160) + W + 160) % (W + 160) - 80;
      const r = 18 * c.s;
      ctx.beginPath();
      ctx.arc(x, c.y, r * 1.3, 0, Math.PI * 2);
      ctx.arc(x + r * 1.4, c.y + 4, r, 0, Math.PI * 2);
      ctx.arc(x - r * 1.4, c.y + 6, r * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHills(offset, color, baseY, amp, period) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 8) {
      const t = (x - offset) / period;
      ctx.lineTo(x, baseY - Math.abs(Math.sin(t)) * amp - Math.sin(t * 2.3) * amp * 0.25);
    }
    ctx.lineTo(W, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }

  function drawPillar(p) {
    const top = p.gapY - p.gap / 2, bottom = p.gapY + p.gap / 2;
    const segs = [[0, top], [bottom, GROUND_Y]];
    for (const [y0, y1] of segs) {
      ctx.fillStyle = C.pillar;
      ctx.fillRect(p.x, y0, PILLAR_W, y1 - y0);
      ctx.fillStyle = C["pillar-dark"];
      ctx.fillRect(p.x + PILLAR_W - 16, y0, 16, y1 - y0);
      ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
      ctx.fillRect(p.x + 10, y0, 8, y1 - y0);
    }
    // Lips facing the gap
    for (const ly of [top - LIP_H, bottom]) {
      ctx.fillStyle = C["pillar-lip"];
      ctx.fillRect(p.x - LIP_OVER, ly, PILLAR_W + LIP_OVER * 2, LIP_H);
      ctx.fillStyle = C["pillar-dark"];
      ctx.fillRect(p.x + PILLAR_W - 10, ly, 10 + LIP_OVER, LIP_H);
      ctx.strokeStyle = C.outline;
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x - LIP_OVER + 1, ly + 1, PILLAR_W + LIP_OVER * 2 - 2, LIP_H - 2);
    }
  }

  function drawGround() {
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);
    ctx.fillStyle = C["pillar-lip"];
    ctx.fillRect(0, GROUND_Y, W, 14);
    ctx.fillStyle = C["pillar-dark"];
    ctx.fillRect(0, GROUND_Y + 14, W, 4);
    ctx.fillStyle = C["ground-dark"];
    for (let x = groundX - 48; x < W + 48; x += 48) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 18);
      ctx.lineTo(x + 24, GROUND_Y + 18);
      ctx.lineTo(x + 8, GROUND_Y + 40);
      ctx.lineTo(x - 16, GROUND_Y + 40);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.angle);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = C.outline;

    ctx.fillStyle = C.bird;                                   // body
    ctx.beginPath(); ctx.ellipse(0, 0, BIRD_R + 3, BIRD_R, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.belly;                                  // belly
    ctx.beginPath(); ctx.ellipse(2, 6, 10, 7, 0, 0, Math.PI * 2); ctx.fill();

    const lift = bird.wing * -10;                             // wing
    ctx.fillStyle = C.belly;
    ctx.beginPath();
    ctx.ellipse(-6, 2 + lift * 0.5, 9, 6 - bird.wing * 2, -0.3 - bird.wing * 0.6, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#ffffff";                                // eye
    ctx.beginPath(); ctx.arc(8, -5, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.outline;
    ctx.beginPath(); ctx.arc(10, -5, 2.6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = C.gold;                                   // beak
    ctx.beginPath();
    ctx.moveTo(15, 0); ctx.lineTo(27, 3); ctx.lineTo(15, 8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function label(str, x, y, size, color = C.ink, align = "center", font = "display") {
    ctx.font = font === "display"
      ? `${size}px "Lilita One", "Arial Rounded MT Bold", sans-serif`
      : `800 ${size}px Nunito, system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(4, size / 7);
    ctx.strokeStyle = C.outline;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = "#fff4dc";
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 16);
    ctx.fill(); ctx.stroke();
  }

  function drawMedal(x, y, medal) {
    ctx.lineWidth = 3;
    ctx.strokeStyle = C.outline;
    ctx.fillStyle = medal ? C[medal.key] : "rgba(34, 38, 58, 0.12)";
    ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.fill();
    if (medal) {
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
      ctx.beginPath(); ctx.arc(x - 8, y - 8, 9, 0, Math.PI * 2); ctx.fill();
    }
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawSky();
    drawHills(hillX * 0.5, C["hill-far"], GROUND_Y - 70, 70, 90);
    drawHills(hillX, C["hill-near"], GROUND_Y - 10, 50, 60);
    pillars.forEach(drawPillar);
    drawGround();
    drawBird();

    if (state === "playing" || state === "paused") label(String(score), W / 2, 80, 64);

    if (state === "ready") {
      label("Get ready", W / 2, 150, 52);
      label("Tap, click or press Space to flap", W / 2, H * 0.42 + 80, 20, C.ink, "center", "body");
      label("Fly through the gaps.", W / 2, H * 0.42 + 110, 20, C.ink, "center", "body");
    }

    if (state === "paused") {
      ctx.fillStyle = "rgba(31, 45, 77, 0.45)";
      ctx.fillRect(0, 0, W, H);
      label("Paused", W / 2, H / 2 - 20, 56);
      label("Press P or tap to keep flying", W / 2, H / 2 + 30, 20, C.ink, "center", "body");
    }

    if (state === "dead" && bird.y + BIRD_R >= GROUND_Y - 1) {
      const medal = MEDALS.find(m => score >= m.at);
      label("Game over", W / 2, 150, 56);
      const px = 50, py = 210, pw = W - 100, ph = 180;
      panel(px, py, pw, ph);
      drawMedal(px + 70, py + 90, medal);
      ctx.fillStyle = C.outline;
      ctx.font = "800 15px Nunito, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(medal ? `${medal.name} medal` : `Medal at 10`, px + 70, py + 145);

      ctx.textAlign = "right";
      ctx.fillText("SCORE", px + pw - 30, py + 38);
      ctx.fillText("BEST", px + pw - 30, py + 104);
      label(String(score), px + pw - 30, py + 66, 36, C.ink, "right");
      label(String(best), px + pw - 30, py + 132, 36, newBest ? C.gold : C.ink, "right");
      if (newBest && score > 0) label("New best!", px + pw / 2 + 20, py + 132, 20, C.gold, "center", "body");

      if (deadTimer > 0.7) label("Tap or press Space to try again", W / 2, py + ph + 50, 20, C.ink, "center", "body");
    }

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${flash * 0.8})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- input ----------
  window.addEventListener("keydown", e => {
    if (["Space", "ArrowUp", "KeyW", "KeyP", "Escape"].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Enter") flap();
    if (e.code === "KeyP" || e.code === "Escape") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    }
  });
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    canvas.focus();
    flap();
  });
  window.addEventListener("blur", () => { if (state === "playing") state = "paused"; });

  // ---------- loop ----------
  time = 0; groundX = 0; hillX = 0; cloudX = 0;
  reset();
  canvas.focus();

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.25, (now - last) / 1000);
    last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
